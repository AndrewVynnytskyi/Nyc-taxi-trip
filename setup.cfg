[flake8]
max-line-length = 100
max-complexity = 10
docstring-convention = google
extend-select = B950
extend-ignore =
    # Handled by black.
    E203,
    E501,
    W503,
    # Docstrings are not required for magic methods / __init__.py re-exports.
    D105,
    D107,
    D104
exclude =
    .git,
    .venv,
    __pycache__,
    build,
    dist,
    .mypy_cache,
    .pytest_cache
per-file-ignores =
    tests/*: D100,D101,D102,D103
