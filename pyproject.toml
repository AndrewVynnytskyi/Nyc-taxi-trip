[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-taxi-trip-analytics"
version = "0.1.0"
description = "Production-grade ETL + deep-learning pipeline for NYC Yellow Taxi trip analytics."
readme = "README.md"
requires-python = ">=3.10,<3.13"
# PEP 639: SPDX expression plus the licence file shipped in the distribution.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrii Vynnytskyi", email = "nikoljavin@gmail.com" }]
keywords = ["mlops", "pytorch", "etl", "nyc-taxi", "regression"]

classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Typing :: Typed",
]

dependencies = [
    "torch>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.1,<3.0",
    "scikit-learn>=1.4,<2.0",
    "pyarrow>=15.0",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg2-binary>=2.9",
    "omegaconf>=2.3",
    "wandb>=0.16",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
data = ["kagglehub>=0.3"]
dev = [
    "black>=24.3",
    "isort>=5.13",
    "flake8>=7.0",
    "flake8-docstrings>=1.7",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "pandas-stubs>=2.1",
    "types-tqdm>=4.66",
]

[project.scripts]
nyc-taxi-etl = "nyc_taxi.etl:main"
nyc-taxi-train = "nyc_taxi.train:main"

[project.urls]
Repository = "https://github.com/AndrewVynnytskyi/Nyc-taxi-trip"

[tool.setuptools]
package-dir = { "" = "src" }
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nyc_taxi = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["nyc_taxi"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
plugins = []

[[tool.mypy.overrides]]
module = ["wandb.*", "kagglehub.*", "sklearn.*", "matplotlib.*", "seaborn.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=nyc_taxi --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["src/nyc_taxi"]
